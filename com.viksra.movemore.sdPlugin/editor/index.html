<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Move More · Stream Deck layout editor</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="editor.css">
	<script type="module" src="app.js"></script>
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<div class="brand">
				<img class="brand-mark" src="favicon.svg" alt="">
				<div>
					<div class="brand-name">Move More</div>
					<div class="brand-sub">Stream Deck layout editor</div>
				</div>
			</div>
			<div class="search" role="search">
				<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5" /><path d="m12.5 12.5 4 4" /></svg>
				<input id="search" type="search" placeholder="Find keys…" aria-label="Find keys (Ctrl+F)" autocomplete="off" spellcheck="false">
				<span id="search-count" class="search-count" aria-live="polite" hidden></span>
				<button id="search-prev" class="search-nav" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match" hidden>
					<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 12.5 4.5-4.5 4.5 4.5" /></svg>
				</button>
				<button id="search-next" class="search-nav" type="button" title="Next match (Enter)" aria-label="Next match" hidden>
					<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 7.5 4.5 4.5 4.5-4.5" /></svg>
				</button>
			</div>
			<nav id="profiles" class="profiles" aria-label="Profiles and pages"></nav>
			<div class="sidebar-foot">
				<button id="btn-backups" class="btn ghost small" type="button">Backups</button>
				<button id="btn-help" class="btn ghost small" type="button">Shortcuts</button>
				<span id="mode" class="mode" hidden>Test mode</span>
			</div>
		</aside>

		<main class="main">
			<header class="topbar">
				<nav id="crumbs" class="crumbs" aria-label="Location"></nav>
				<div class="spacer"></div>
				<div id="view" class="segmented" role="group" aria-label="Pages shown">
					<button type="button" data-view="one" aria-pressed="true" title="Show only the active page">One page</button>
					<button type="button" data-view="family" aria-pressed="false" title="Show the active page and every folder inside it">Page + folders</button>
					<button type="button" data-view="pages" aria-pressed="false" title="Show every page side by side">All pages</button>
					<button type="button" data-view="all" aria-pressed="false" title="Show every page and every folder">All + folders</button>
				</div>
				<div class="history">
					<button id="btn-undo" class="btn icon" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">
						<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 3.5 9l4 4" /><path d="M4 9h8a4.5 4.5 0 0 1 0 9h-2" /></svg>
					</button>
					<button id="btn-redo" class="btn icon" type="button" title="Redo (Ctrl+Y)" aria-label="Redo">
						<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5 4 4-4 4" /><path d="M16 9H8a4.5 4.5 0 0 0 0 9h2" /></svg>
					</button>
				</div>
				<div id="pending" class="pending" aria-live="polite"></div>
				<button id="btn-discard" class="btn" type="button">Discard</button>
				<button id="btn-apply" class="btn primary" type="button">Apply</button>
			</header>

			<div id="banner" class="banner" role="status" hidden></div>

			<section id="stage" class="stage">
				<div id="panes" class="panes" hidden></div>
				<div id="empty" class="empty" hidden></div>
			</section>

			<footer class="actionbar">
				<div id="selinfo" class="selinfo"></div>
				<div class="spacer"></div>
				<button id="btn-moveto" class="btn" type="button" aria-haspopup="menu">Move to page…</button>
				<button id="btn-cut" class="btn" type="button" title="Ctrl+X">Cut</button>
				<button id="btn-paste" class="btn" type="button" title="Ctrl+V">Paste here</button>
				<button id="btn-selall" class="btn ghost" type="button" title="Ctrl+A">Select all</button>
				<div class="zoom" role="group" aria-label="Zoom">
					<button id="zoom-out" class="zoom-btn" type="button" title="Zoom out (Ctrl+−, or Ctrl+scroll)" aria-label="Zoom out">
						<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10" /></svg>
					</button>
					<button id="zoom-fit" class="zoom-label" type="button" title="Fit to the window (Ctrl+0)">Fit</button>
					<button id="zoom-in" class="zoom-btn" type="button" title="Zoom in (Ctrl++, or Ctrl+scroll)" aria-label="Zoom in">
						<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5v10M5 10h10" /></svg>
					</button>
				</div>
			</footer>
		</main>
	</div>

	<div id="marquee" class="marquee" hidden></div>
	<div id="peek" class="peek" role="tooltip" hidden></div>
	<div id="drag-badge" class="drag-badge" hidden></div>
	<div id="menu" class="menu" role="menu" hidden></div>
	<div id="toasts" class="toasts" aria-live="polite"></div>
	<dialog id="dialog" class="dialog"></dialog>
	<div id="overlay" class="overlay" hidden>
		<div class="overlay-card" role="status" aria-live="assertive">
			<div class="spinner" aria-hidden="true"></div>
			<div id="overlay-title" class="overlay-title"></div>
			<div id="overlay-text" class="overlay-text"></div>
		</div>
	</div>
</body>
</html>
